<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Site</title>
</head>
<body>
    <h1>Welcome to the Puzzle Site</h1>
    <div id="puzzle-container">
        <!-- Puzzle content here -->
    </div>
    <audio id="bgm" src="assets/abandon-ship.mp3" preload="none"></audio>
    <script>
        let bgm = document.getElementById('bgm');

        // Function to fade in the background music
        function fadeIn(element) {
            element.volume = 0; 
            element.play();
            let fadeEffect = setInterval(() => {
                if (element.volume < 0.1) {
                    element.volume += 0.01;
                } else {
                    clearInterval(fadeEffect);
                }
            }, 150);
        }

        // Function to fade out the background music
        function fadeOut(element) {
            let fadeEffect = setInterval(() => {
                if (element.volume > 0) {
                    element.volume -= 0.01;
                } else {
                    element.pause();
                    clearInterval(fadeEffect);
                }
            }, 150);
        }

        // Simulated event listeners for puzzle success
        document.getElementById('input1-success').addEventListener('click', function() {
            fadeIn(bgm);
        });

        document.getElementById('step3-reach').addEventListener('click', function() {
            fadeOut(bgm);
        });
    </script>
</body>
</html>
